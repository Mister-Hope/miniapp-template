packages:
  - app/
  - cloud/*

allowBuilds:
  "@parcel/watcher": true
  core-js-pure: true
  es5-ext: true
  protobufjs: true
  unrs-resolver: true

overrides:
  css: npm:@adobe/css-tools@^4.4.3
  postcss: ^8.5.10
  vinyl-fs: ^4.0.2

virtualStoreType: global

trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyIgnoreAfter: 720
