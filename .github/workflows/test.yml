name: Build Test

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.22.1

      - name: Install project
        run: pnpm ci

      - name: Build project
        run: pnpm run build

      - name: Linter test
        run: pnpm run lint
